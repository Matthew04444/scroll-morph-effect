<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Morph Image Effect</title>
    <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <section class="spacer">
        <h1>Листайте вниз, чтобы увидеть эффект</h1>
    </section>
    <div class="scroll-container" id="scrollContainer">
        <div class="sticky-frame">
            <!-- Первая (исходная) картинка -->
            <img src="https://unsplash.com" alt="Image 1" class="bg-image img-base">
            <img src="https://unsplash.com" alt="Image 2" class="bg-image img-overlay" id="overlayImage">
            
            <div class="text-overlay">
                <h2>Плавная смена изображений</h2>
                 </div>
        </div>
    </div>
    <!-- Контент после анимации -->
    <section class="spacer">
        <h2>Эффект завершен</h2>
    </section>
    <script src="index.js"></script>
    </body>
</html>
